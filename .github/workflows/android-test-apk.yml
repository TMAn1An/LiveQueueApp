name: Android test APK

# Builds an installable test APK from master and uploads it as a workflow
# artifact. It creates no tag and no GitHub Release.
#
# Signing: uses the release key when the ANDROID_* secrets are configured;
# otherwise the build is explicitly signed with a throwaway debug key
# (LIVEQUEUE_TEST_SIGNING=debug) and labelled DEBUG/TEST-SIGNED.
# Firebase: uses GOOGLE_SERVICES_JSON_BASE64 when configured; otherwise
# generates google-services.json at build time from the public client config
# already committed in lib/firebase_options.dart (nothing new is committed).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.9
  API_BASE_URL: https://livequeueapp.onrender.com
  PACKAGE_ID: com.livequeue.mobile_app

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - name: Production health (read-only)
        continue-on-error: true
        run: |
          for url in "$API_BASE_URL/health" https://livequeue-dashboard.pages.dev; do
            code=$(curl -s -o /dev/null -m 60 -w '%{http_code}' "$url" || true)
            echo "$url -> HTTP $code"
            echo "- \`$url\` → HTTP $code" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Read app version
        run: |
          version=$(sed -n 's/^version: *\([^ ]*\).*/\1/p' pubspec.yaml)
          name=${version%%+*}; code=${version##*+}
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "APK_BASENAME=LiveQueue-v$name-build$code-test" >> "$GITHUB_ENV"
          echo "App version $name ($code) from $(git rev-parse HEAD)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      # Info-level lints are pre-existing style hints; warnings and errors fail.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Firebase config
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          out=android/app/google-services.json
          if [ -n "$GS" ]; then
            printf '%s' "$GS" | base64 --decode > "$out"
            echo "FIREBASE_SOURCE=GOOGLE_SERVICES_JSON_BASE64 secret" >> "$GITHUB_ENV"
          else
            python3 - "$out" <<'EOF'
          import json, re, sys
          src = open('lib/firebase_options.dart').read()
          block = re.search(r'static const FirebaseOptions android = FirebaseOptions\((.*?)\);', src, re.S).group(1)
          o = dict(re.findall(r"(\w+): '([^']*)'", block))
          cfg = {
            "project_info": {"project_number": o["messagingSenderId"], "project_id": o["projectId"],
                             "storage_bucket": o["storageBucket"]},
            "client": [{
              "client_info": {"mobilesdk_app_id": o["appId"],
                              "android_client_info": {"package_name": "com.livequeue.mobile_app"}},
              "oauth_client": [],
              "api_key": [{"current_key": o["apiKey"]}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}},
            }],
            "configuration_version": "1",
          }
          json.dump(cfg, open(sys.argv[1], 'w'))
          EOF
            echo "FIREBASE_SOURCE=generated from lib/firebase_options.dart" >> "$GITHUB_ENV"
          fi

      - name: Signing config
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$KA" ] && [ -n "$KP" ]; then
            ks="$RUNNER_TEMP/release.jks"
            printf '%s' "$KS" | base64 --decode > "$ks"
            umask 077
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ks" "$KSP" "$KA" "$KP" > android/key.properties
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Release signing secrets not configured — building a DEBUG/TEST-SIGNED APK."
            echo "LIVEQUEUE_TEST_SIGNING=debug" >> "$GITHUB_ENV"
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          [ -f "$apk" ] || { echo "::error::APK not produced"; exit 1; }
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          badging=$("$bt/aapt2" dump badging "$apk")
          # Here-strings, not pipes into grep -q/head: an early-exiting reader
          # would SIGPIPE the writer and fail the step under pipefail.
          line1=$(sed -n 1p <<<"$badging")
          echo "$line1"
          grep -q "name='$PACKAGE_ID'" <<<"$line1" || { echo "::error::wrong package id"; exit 1; }
          grep -q "versionCode='$VERSION_CODE'" <<<"$line1" || { echo "::error::wrong versionCode"; exit 1; }
          grep -q "versionName='$VERSION_NAME'" <<<"$line1" || { echo "::error::wrong versionName"; exit 1; }
          if grep -q application-debuggable <<<"$badging"; then debuggable=yes; else debuggable=no; fi

          unzip -p "$apk" lib/arm64-v8a/libapp.so | strings | grep -F "$API_BASE_URL" >/dev/null \
            || { echo "::error::production API_BASE_URL not compiled into the APK"; exit 1; }

          "$bt/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          schemes=$(grep -E '^Verified using v[0-9.]+ scheme.*: true' "$RUNNER_TEMP/certs.txt" | sed 's/^Verified using \(v[0-9.]*\).*/\1/' | paste -sd, -)
          dn=$(sed -n 's/^Signer #1 certificate DN: //p' "$RUNNER_TEMP/certs.txt")
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")
          if grep -qi 'CN=Android Debug' <<<"$dn"; then
            label="DEBUG/TEST-SIGNED"
          else
            label="PRODUCTION RELEASE-SIGNED"
          fi
          if [ "$SIGNING" = release ] && [ "$label" != "PRODUCTION RELEASE-SIGNED" ]; then
            echo "::error::release key configured but APK is debug-signed"; exit 1
          fi

          mkdir -p "$RUNNER_TEMP/out"
          out="$RUNNER_TEMP/out/$APK_BASENAME.apk"
          cp "$apk" "$out"
          sha=$(sha256sum "$out" | cut -d' ' -f1)
          size=$(stat -c %s "$out")
          echo "APK_PATH=$out" >> "$GITHUB_ENV"
          {
            echo "### $APK_BASENAME.apk — $label"
            echo "| | |"; echo "|---|---|"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
            echo "| Package | \`$PACKAGE_ID\` |"
            echo "| versionName / versionCode | $VERSION_NAME / $VERSION_CODE |"
            echo "| API_BASE_URL | $API_BASE_URL (found in compiled app) |"
            echo "| Signing | $label |"
            echo "| Certificate DN | $dn |"
            echo "| Certificate SHA-256 | \`$cert\` |"
            echo "| Signature schemes | $schemes |"
            echo "| Debuggable | $debuggable |"
            echo "| Firebase config | $FIREBASE_SOURCE |"
            echo "| Size | $size bytes |"
            echo "| APK SHA-256 | \`$sha\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/google-services.json "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
