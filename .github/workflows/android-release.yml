name: Android release

# Official LiveQueue Android APK. Builds from the commit it is dispatched on
# (master), verifies the APK is release-signed (never the debug key), and —
# when `publish` is true — tags that exact commit and publishes a GitHub
# Release with the APK attached.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
#   GOOGLE_SERVICES_JSON_BASE64  base64 of android/app/google-services.json
# Optional repository variable:
#   ANDROID_RELEASE_CERT_SHA256  expected signing-certificate SHA-256 (hex,
#                                colons optional). When set, a build signed by
#                                any other certificate fails.
# See docs/ANDROID_RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. v2.1.3). Must not exist yet.
        required: true
      publish:
        description: Create the tag and publish the GitHub Release after verification
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.9
  API_BASE_URL: https://livequeueapp.onrender.com
  PACKAGE_ID: com.livequeue.mobile_app

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"; exit 1
          fi
          [ -n "$API_BASE_URL" ] || { echo "::error::API_BASE_URL is empty"; exit 1; }
          [[ "$API_BASE_URL" == https://* ]] || { echo "::error::API_BASE_URL must be https"; exit 1; }
          version=$(sed -n 's/^version: *\([^ ]*\).*/\1/p' pubspec.yaml)
          echo "VERSION_NAME=${version%%+*}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${version##*+}" >> "$GITHUB_ENV"
          echo "Building $TAG from $(git rev-parse HEAD), app version $version"

      - name: Check secrets are present
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          missing=()
          [ -n "$KS" ]  || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$KSP" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$KA" ]  || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$KP" ]  || missing+=(ANDROID_KEY_PASSWORD)
          [ -n "$GS" ]  || missing+=(GOOGLE_SERVICES_JSON_BASE64)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$GS" | base64 --decode > android/app/google-services.json
          python3 - <<'EOF'
          import json, os, sys
          d = json.load(open('android/app/google-services.json'))
          pkgs = [c['client_info']['android_client_info']['package_name'] for c in d.get('client', [])]
          if os.environ['PACKAGE_ID'] not in pkgs:
              sys.exit('::error::google-services.json has no client for ' + os.environ['PACKAGE_ID'])
          print('google-services.json OK for', os.environ['PACKAGE_ID'])
          EOF

      - name: Restore release keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/release.jks"
          printf '%s' "$KS" | base64 --decode > "$ks"
          umask 077
          {
            echo "storeFile=$ks"
            echo "storePassword=$KSP"
            echo "keyAlias=$KA"
            echo "keyPassword=$KP"
          } > android/key.properties
          # Fails here (not mid-build) if the keystore, alias or password is wrong.
          keytool -list -keystore "$ks" -storepass:env KSP -alias "$KA" >/dev/null

      - run: flutter pub get

      # Info-level lints are pre-existing style hints; warnings and errors fail.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify APK
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          [ -f "$apk" ] || { echo "::error::APK not produced"; exit 1; }
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          "$bt/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          grep -E 'Verified using|Signer #1 certificate (DN|SHA-256)' "$RUNNER_TEMP/certs.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK is signed with the Android debug certificate"; exit 1
          fi
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")
          [ -n "$cert" ] || { echo "::error::could not read signing certificate"; exit 1; }
          if [ -n "$EXPECTED_CERT" ]; then
            want=$(echo "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            [ "$cert" = "$want" ] || { echo "::error::signing certificate $cert does not match ANDROID_RELEASE_CERT_SHA256"; exit 1; }
          fi

          badging=$("$bt/aapt2" dump badging "$apk" | head -1)
          echo "$badging"
          echo "$badging" | grep -q "name='$PACKAGE_ID'" || { echo "::error::wrong package id"; exit 1; }
          echo "$badging" | grep -q "versionCode='$VERSION_CODE'" || { echo "::error::wrong versionCode"; exit 1; }
          echo "$badging" | grep -q "versionName='$VERSION_NAME'" || { echo "::error::wrong versionName"; exit 1; }
          if "$bt/aapt2" dump badging "$apk" | grep -q "application-debuggable"; then
            echo "::error::APK is debuggable"; exit 1
          fi

          unzip -p "$apk" lib/arm64-v8a/libapp.so | strings | grep -qF "$API_BASE_URL" \
            || { echo "::error::production API_BASE_URL not compiled into the APK"; exit 1; }

          out="$RUNNER_TEMP/LiveQueue-$TAG.apk"
          cp "$apk" "$out"
          sha=$(sha256sum "$out" | cut -d' ' -f1)
          size=$(stat -c %s "$out")
          echo "APK_PATH=$out" >> "$GITHUB_ENV"
          echo "APK_SHA256=$sha" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"
          {
            echo "### LiveQueue $TAG"
            echo "| | |"; echo "|---|---|"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
            echo "| Package | \`$PACKAGE_ID\` |"
            echo "| Version | $VERSION_NAME ($VERSION_CODE) |"
            echo "| APK | LiveQueue-$TAG.apk, $size bytes |"
            echo "| APK SHA-256 | \`$sha\` |"
            echo "| Signing cert SHA-256 | \`$cert\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/google-services.json "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: LiveQueue-${{ inputs.tag }}-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Tag and publish GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes="../docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "::error::release notes $notes not found"; exit 1; }
          cp "$notes" "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "### APK"
            echo "- File: \`LiveQueue-$TAG.apk\`"
            echo "- Version: $VERSION_NAME ($VERSION_CODE)"
            echo "- SHA-256: \`$APK_SHA256\`"
            echo "- Signing certificate SHA-256: \`$CERT_SHA256\`"
          } >> "$RUNNER_TEMP/notes.md"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" "$APK_PATH" \
            --verify-tag \
            --title "LiveQueue $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
