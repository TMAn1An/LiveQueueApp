org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental-compilation cache computes paths relative to the
# project root; when the project and Gradle/pub caches live on different
# drive letters (as in this environment: project on D:, caches on C:), that
# relative-path computation throws ("this and base files have different
# roots"). Incremental compilation is a build-speed optimization only —
# disabling it is a safe environment-specific workaround, not a behavior
# change.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
